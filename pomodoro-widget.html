<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notion Pomodoro Timer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: transparent;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .timer-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 24px 30px;
      width: 100%;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #d93829;
      color: #ffffff;
      padding: 4px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .cycle-text {
      font-size: 12px;
      color: #212529;
      font-weight: 500;
      margin-top: 8px;
      margin-bottom: 2px;
    }

    .timer-digits {
      font-size: 64px;
      font-weight: 800;
      color: #212529;
      line-height: 1.1;
      letter-spacing: -2px;
      font-variant-numeric: tabular-nums;
    }

    .timer-labels {
      display: flex;
      justify-content: space-between;
      width: 160px;
      font-size: 11px;
      color: #495057;
      margin-top: -2px;
      margin-bottom: 18px;
    }

    .button-group {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    button {
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 32px;
      padding: 0 12px;
      transition: all 0.15s ease;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-start {
      background: #2b7cc4;
      color: #ffffff;
      flex: 1;
    }
    .btn-start:hover:not(:disabled) {
      background: #2368a5;
    }

    .btn-pause {
      background: #e5b044;
      color: #3b2800;
      gap: 5px;
      flex: 1.2;
    }
    .btn-pause:hover:not(:disabled) {
      background: #cca037;
    }

    .toggle-pill {
      display: inline-block;
      width: 22px;
      height: 12px;
      background: rgba(0, 0, 0, 0.18);
      border-radius: 10px;
      position: relative;
    }
    .toggle-circle {
      display: block;
      width: 10px;
      height: 10px;
      background: #ffffff;
      border-radius: 50%;
      position: absolute;
      top: 1px;
      left: 1px;
      transition: transform 0.2s;
    }
    .btn-pause.active .toggle-circle {
      transform: translateX(10px);
    }

    .btn-stop {
      background: #ffffff;
      color: #d93829;
      border: 1.2px solid #eecac6;
      flex: 1;
    }
    .btn-stop:hover:not(:disabled) {
      background: #fdf2f1;
    }

    .log-container {
      margin-top: 14px;
      width: 100%;
      display: none;
    }

    .log-box {
      background: #f8f9fa;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 11px;
      color: #333;
      text-align: left;
      border-left: 3px solid #d93829;
      word-break: break-all;
      margin-bottom: 6px;
    }

    .btn-copy {
      width: 100%;
      background: #f1f3f5;
      color: #333;
      border: 1px solid #dee2e6;
    }
    .btn-copy:hover {
      background: #e9ecef;
    }
  </style>
</head>
<body>

<div class="timer-card">
  <div id="statusBadge" class="status-badge">
    <span>🍅</span>
    <span id="badgeText">Deep Work (Session #1)</span>
  </div>

  <div id="cycleText" class="cycle-text">Cycle: 1 / 4</div>
  <div id="timerDigits" class="timer-digits">25:00</div>

  <div class="timer-labels">
    <span>minutes</span>
    <span>seconds</span>
  </div>

  <div class="button-group">
    <button id="startBtn" class="btn-start" onclick="startPomodoro()">Start</button>
    <button id="pauseBtn" class="btn-pause" onclick="togglePause()" disabled>
      <span>Pause</span>
      <span class="toggle-pill"><span id="toggleCircle" class="toggle-circle"></span></span>
    </button>
    <button id="stopBtn" class="btn-stop" onclick="stopPomodoro()" disabled>Stop</button>
  </div>

  <div id="logContainer" class="log-container">
    <div id="logBox" class="log-box"></div>
    <button id="copyBtn" class="btn-copy" onclick="copyLog(event)">📋 복사하기</button>
  </div>
</div>

<script>
  const FOCUS_TIME = 25 * 60;
  const SHORT_BREAK = 5 * 60;
  const LONG_BREAK = 30 * 60;

  let timerInterval = null;
  let currentSeconds = FOCUS_TIME;
  let isFocus = true;
  let isPaused = false;
  let completedFocusSessions = 0;
  let cycleCount = 1;
  let overallStartTime = null;
  let generatedLog = "";

  function formatDisplay(sec) {
    const m = String(Math.floor(sec / 60)).padStart(2, '0');
    const s = String(sec % 60).padStart(2, '0');
    return `${m}:${s}`;
  }

  function formatClock(date) {
    return date.toTimeString().split(' ')[0].substring(0, 5);
  }

  function updateDisplay() {
    document.getElementById("timerDigits").innerText = formatDisplay(currentSeconds);
  }

  function startPomodoro() {
    overallStartTime = new Date();
    completedFocusSessions = 0;
    cycleCount = 1;
    isFocus = true;
    isPaused = false;
    currentSeconds = FOCUS_TIME;

    document.getElementById("startBtn").disabled = true;
    document.getElementById("pauseBtn").disabled = false;
    document.getElementById("stopBtn").disabled = false;
    document.getElementById("pauseBtn").classList.remove("active");
    document.getElementById("logContainer").style.display = "none";

    setPhaseUI();
    runTimer();
  }

  function togglePause() {
    const pauseBtn = document.getElementById("pauseBtn");
    if (!isPaused) {
      clearInterval(timerInterval);
      isPaused = true;
      pauseBtn.classList.add("active");
    } else {
      isPaused = false;
      pauseBtn.classList.remove("active");
      runTimer();
    }
  }

  function setPhaseUI() {
    const badgeText = document.getElementById("badgeText");
    const statusBadge = document.getElementById("statusBadge");
    const cycleText = document.getElementById("cycleText");

    if (isFocus) {
      badgeText.innerText = `Deep Work (Session #${completedFocusSessions + 1})`;
      statusBadge.style.background = "#d93829";
      cycleText.innerText = `Cycle: ${cycleCount} / 4`;
    } else {
      const isLong = (cycleCount === 4);
      badgeText.innerText = isLong ? "Long Break" : "Short Break";
      statusBadge.style.background = "#2b7cc4";
      cycleText.innerText = isLong ? "4 Cycle Complete!" : `Cycle: ${cycleCount} / 4`;
    }
  }

  function runTimer() {
    updateDisplay();
    timerInterval = setInterval(() => {
      currentSeconds--;
      updateDisplay();

      if (currentSeconds <= 0) {
        clearInterval(timerInterval);
        handlePhaseEnd();
      }
    }, 1000);
  }

  function handlePhaseEnd() {
    if (isFocus) {
      completedFocusSessions++;
      if (cycleCount === 4) {
        isFocus = false;
        currentSeconds = LONG_BREAK;
      } else {
        isFocus = false;
        currentSeconds = SHORT_BREAK;
      }
    } else {
      if (cycleCount === 4) {
        cycleCount = 1;
      } else {
        cycleCount++;
      }
      isFocus = true;
      currentSeconds = FOCUS_TIME;
    }

    setPhaseUI();
    runTimer();
  }

  function stopPomodoro() {
    clearInterval(timerInterval);
    const overallEndTime = new Date();

    const currentPhaseTotal = isFocus ? FOCUS_TIME : (cycleCount === 4 ? LONG_BREAK : SHORT_BREAK);
    const elapsedInCurrent = currentPhaseTotal - currentSeconds;
    const elapsedMinutesInCurrent = Math.floor(elapsedInCurrent / 60);

    let detailStr = "";
    if (isFocus) {
      detailStr = `${completedFocusSessions}타임 완료, ${completedFocusSessions + 1}번째 타임 ${elapsedMinutesInCurrent}분 진행 중 종료`;
    } else {
      detailStr = `${completedFocusSessions}타임 완료 후 휴식 중 종료`;
    }

    const startClock = formatClock(overallStartTime);
    const endClock = formatClock(overallEndTime);
    generatedLog = `- 🍅 [${startClock} ~ ${endClock}] (${detailStr})`;

    document.getElementById("logBox").innerText = generatedLog;
    document.getElementById("logContainer").style.display = "block";
    document.getElementById("copyBtn").innerText = "📋 복사하기";

    document.getElementById("startBtn").disabled = false;
    document.getElementById("pauseBtn").disabled = true;
    document.getElementById("stopBtn").disabled = true;
    document.getElementById("pauseBtn").classList.remove("active");
  }

  function copyLog(e) {
    if (e) e.preventDefault();
    const copyBtn = document.getElementById("copyBtn");

    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(generatedLog)
        .then(() => {
          copyBtn.innerText = "✓ 복사 완료!";
          setTimeout(() => { copyBtn.innerText = "📋 복사하기"; }, 2000);
        })
        .catch(() => fallbackCopy());
    } else {
      fallbackCopy();
    }
  }

  function fallbackCopy() {
    const copyBtn = document.getElementById("copyBtn");
    const textArea = document.createElement("textarea");
    textArea.value = generatedLog;
    textArea.style.position = "fixed";
    textArea.style.top = "0";
    textArea.style.left = "0";
    textArea.style.width = "1px";
    textArea.style.height = "1px";
    textArea.style.opacity = "0";
    document.body.appendChild(textArea);
    textArea.focus({ preventScroll: true });
    textArea.select();
    try {
      document.execCommand('copy');
      copyBtn.innerText = "✓ 복사 완료!";
      setTimeout(() => { copyBtn.innerText = "📋 복사하기"; }, 2000);
    } catch (err) {
      copyBtn.innerText = "⚠️ 직접 드래그해 복사하세요";
    }
    document.body.removeChild(textArea);
  }
</script>
</body>
</html>
