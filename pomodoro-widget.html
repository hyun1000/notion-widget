<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notion Pomodoro Timer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }

    .timer-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 20px 24px;
      width: 100%;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #d93829;
      color: #ffffff;
      padding: 4px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .cycle-text {
      font-size: 12px;
      color: #212529;
      font-weight: 500;
      margin-top: 8px;
      margin-bottom: 2px;
    }

    .timer-digits {
      font-size: 64px;
      font-weight: 800;
      color: #212529;
      line-height: 1.1;
      letter-spacing: -2px;
      font-variant-numeric: tabular-nums;
      user-select: none;
    }

    .timer-labels {
      display: flex;
      justify-content: space-between;
      width: 160px;
      font-size: 11px;
      color: #495057;
      margin-top: -2px;
      margin-bottom: 16px;
      user-select: none;
    }

    .button-group {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    button {
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 34px;
      padding: 0 12px;
      transition: opacity 0.15s ease, transform 0.1s ease;
      user-select: none;
      pointer-events: auto;
    }

    button:active:not(:disabled) {
      transform: scale(0.97);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      pointer-events: none;
    }

    .btn-start {
      background: #2b7cc4;
      color: #ffffff;
      flex: 1;
    }

    .btn-pause {
      background: #e5b044;
      color: #3b2800;
      gap: 5px;
      flex: 1.2;
    }

    .toggle-pill {
      display: inline-block;
      width: 22px;
      height: 12px;
      background: rgba(0, 0, 0, 0.18);
      border-radius: 10px;
      position: relative;
      pointer-events: none;
    }

    .toggle-circle {
      display: block;
      width: 10px;
      height: 10px;
      background: #ffffff;
      border-radius: 50%;
      position: absolute;
      top: 1px;
      left: 1px;
      transition: transform 0.2s;
    }

    .btn-pause.active .toggle-circle {
      transform: translateX(10px);
    }

    .btn-stop {
      background: #ffffff;
      color: #d93829;
      border: 1.2px solid #eecac6;
      flex: 1;
    }

    .log-container {
      margin-top: 14px;
      width: 100%;
      display: none;
    }

    .log-box {
      background: #f8f9fa;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 11px;
      color: #333;
      text-align: left;
      border-left: 3px solid #d93829;
      word-break: break-all;
      margin-bottom: 6px;
    }

    .btn-copy {
      width: 100%;
      background: #f1f3f5;
      color: #333;
      border: 1px solid #dee2e6;
    }
  </style>
</head>
<body>

<div class="timer-card">
  <div id="statusBadge" class="status-badge">
    <span>🍅</span>
    <span id="badgeText">Deep Work (Session #1)</span>
  </div>

  <div id="cycleText" class="cycle-text">Cycle: 1 / 4</div>
  <div id="timerDigits" class="timer-digits">25:00</div>

  <div class="timer-labels">
    <span>minutes</span>
    <span>seconds</span>
  </div>

  <div class="button-group">
    <button type="button" id="startBtn" class="btn-start">Start</button>
    <button type="button" id="pauseBtn" class="btn-pause" disabled>
      <span>Pause</span>
      <span class="toggle-pill"><span class="toggle-circle"></span></span>
    </button>
    <button type="button" id="stopBtn" class="btn-stop" disabled>Stop</button>
  </div>

  <div id="logContainer" class="log-container">
    <div id="logBox" class="log-box"></div>
    <button type="button" id="copyBtn" class="btn-copy">📋 복사하기</button>
  </div>
</div>

<script>
  const FOCUS_TIME = 25 * 60;
  const SHORT_BREAK = 5 * 60;
  const LONG_BREAK = 30 * 60;

  let timerInterval = null;
  let currentSeconds = FOCUS_TIME;
  let isFocus = true;
  let isPaused = false;
  let completedFocusSessions = 0;
  let cycleCount = 1;
  let overallStartTime = null;
  let generatedLog = "";

  const startBtn = document.getElementById("startBtn");
  const pauseBtn = document.getElementById("pauseBtn");
  const stopBtn = document.getElementById("stopBtn");
  const copyBtn = document.getElementById("copyBtn");
  const timerDigits = document.getElementById("timerDigits");
  const badgeText = document.getElementById("badgeText");
  const statusBadge = document.getElementById("statusBadge");
  const cycleText = document.getElementById("cycleText");
  const logContainer = document.getElementById("logContainer");
  const logBox = document.getElementById("logBox");

  function formatDisplay(sec) {
    const m = String(Math.floor(sec / 60)).padStart(2, '0');
    const s = String(sec % 60).padStart(2, '0');
    return `${m}:${s}`;
  }

  function formatClock(date) {
    return date.toTimeString().split(' ')[0].substring(0, 5);
  }

  function updateDisplay() {
    timerDigits.innerText = formatDisplay(currentSeconds);
  }

  function startPomodoro() {
    overallStartTime = new Date();
    completedFocusSessions = 0;
    cycleCount = 1;
    isFocus = true;
    isPaused = false;
    currentSeconds = FOCUS_TIME;

    startBtn.disabled = true;
    pauseBtn.disabled = false;
    stopBtn.disabled = false;
    pauseBtn.classList.remove("active");
    logContainer.style.display = "none";

    setPhaseUI();
    runTimer();
  }

  function togglePause() {
    if (!isPaused) {
      clearInterval(timerInterval);
      isPaused = true;
      pauseBtn.classList.add("active");
    } else {
      isPaused = false;
      pauseBtn.classList.remove("active");
      runTimer();
    }
  }

  function setPhaseUI() {
    if (isFocus) {
      badgeText.innerText = `Deep Work (Session #${completedFocusSessions + 1})`;
      statusBadge.style.background = "#d93829";
      cycleText.innerText = `Cycle: ${cycleCount} / 4`;
    } else {
      const isLong = (cycleCount === 4);
      badgeText.innerText = isLong ? "Long Break" : "Short Break";
      statusBadge.style.background = "#2b7cc4";
      cycleText.innerText = isLong ? "4 Cycle Complete!" : `Cycle: ${cycleCount} / 4`;
    }
  }

  function runTimer() {
    updateDisplay();
    timerInterval = setInterval(() => {
      currentSeconds--;
      updateDisplay();

      if (currentSeconds <= 0) {
        clearInterval(timerInterval);
        handlePhaseEnd();
      }
    }, 1000);
  }

  function handlePhaseEnd() {
    if (isFocus) {
      completedFocusSessions++;
      if (cycleCount === 4) {
        isFocus = false;
        currentSeconds = LONG_BREAK;
      } else {
        isFocus = false;
        currentSeconds = SHORT_BREAK;
      }
